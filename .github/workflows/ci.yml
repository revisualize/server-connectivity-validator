# Path:     .github/workflows/ci.yml
# Project:  revisualized.com demo repositories
# Revision: 2
# Updated:  2026-07-22
# Note:     Identical file for all three demo repos. shellcheck reads each
#           script's shebang, so the POSIX probe is checked as sh and the
#           bash scripts are checked as bash without hardcoding a dialect.
#           Revision 1 linted a single named script, which meant scripts added
#           later, or repos with a differently named script, went unchecked.
name: ci
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static analysis of every shell script
        run: |
          set -euo pipefail
          if [ -z "$(find . -name '*.sh' -type f -not -path './.git/*')" ]; then
            echo "No shell scripts found to check."
            exit 0
          fi
          find . -name '*.sh' -type f -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=style

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: |
          set -euo pipefail
          if [ -d test ]; then
            bats test/
          else
            find . -name '*.bats' -type f -not -path './.git/*' -print0 \
              | xargs -0 --no-run-if-empty bats
          fi
